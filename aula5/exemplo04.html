<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
     
     h1
     {
        background-color: rgb(255, 0, 128);
        color: aliceblue;
        padding: 20px;
        text-align: center;
     }

     table, th, td
     {
        border: 1px solid black;
        border-collapse: collapse;
        padding: 5px;
     }

    </style>

</head>
<body>
    
    <h1>Aula 05 - Exemplo 4</h1>

    <h3>Exemplo do Rowspan</h3>

    <table>
      
        <tr>
         <th>Aula</th>
         <th>Quarta-Feira</th>
         <th>Quinta-Feira</th>
         <th>Sexta-Feira</th>
        </tr>

        <tr>
            <td>1ª aula</td>
            <td rowspan="2">AD/PA</td>
            <td>Matematica</td>
            <td>Quimica</td>
        </tr>

        <tr>
            <td>2ª aula</td>
            <td>Portugues</td>
            <td rowspan="2">Ed. Fisica</td>
        </tr>

        
        <tr>
            <td>3ª aula</td>
            <td>Artes</td>
            <td rowspan="2">BD/IW1</td>
        </tr>

        
        <tr>
            <td>4ª aula</td>
            <td>Geografia</td>
            <td>Biologia</td>
        </tr>

        
        <tr>
            <td>5ª aula</td>
            <td rowspan="2">Ingles</td>
            <td>Quimica</td>
            <td rowspan="2">IW1/BD</td>
        </tr>

        
        <tr>
            <td>6ª aula</td>
            <td>Matematica</td>
        </tr>

    </table>

</body>
</html>
